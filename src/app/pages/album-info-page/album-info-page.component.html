<div class="body">

    <div class="al-head">
        <div class="al-info">
            <img *ngIf="album?.image" class="al-cover" [src]="'data:image/jpg;base64,' + album.image" alt="">
            <div class="al-text">
                <span class="al-tag">ÁLBUM</span>
                <h3>{{ album?.name || 'Álbum' }}</h3>

                <div class="al-progress">
                    <div class="al-bar"><div [style.width.%]="progress"></div></div>
                    <span>{{ watchedCount }} / {{ totalAlbums }}</span>
                </div>
            </div>
        </div>

        <button type="button" class="al-delete" (click)="deleteAlbum()">
            <i class="uil uil-trash-alt"></i> Eliminar álbum
        </button>
    </div>

    <div class="mainData">

        <div class="gallery-container" *ngIf="resultFilter.length > 0">

            <div class="movie-card" *ngFor="let movie of resultFilter">
                <div class="cardImage">
                    <img class="image" title="{{ movie.name }}" [class.grayscale]="!movie.watched" [src]="movie.image"
                        [alt]="movie.name" />
                </div>

                <button class="delete-button" (click)="watch(movie.id)">
                    <i class="uil uil-eye"></i>
                </button>

                <div class="stars">
                    <p class="title">{{movie.name}}</p>
                </div>
            </div>
        </div>

        <p class="al-empty" *ngIf="!loading && resultFilter.length === 0">Este álbum aún no tiene postales.</p>

    </div>

    <app-loader *ngIf="loading"></app-loader>

</div>
