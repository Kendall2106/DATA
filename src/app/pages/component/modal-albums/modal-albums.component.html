<div class="modalPrin">

    <div class="modal-body">

        <div class="albums-toolbar">
            <button type="button" class="albums-add-btn" (click)="toggleForm()">
                <i class="uil uil-plus"></i> {{ showForm ? 'Cancelar' : 'Nuevo álbum' }}
            </button>
        </div>

        <form class="album-form" *ngIf="showForm" (ngSubmit)="saveAlbum()">
            <input type="text" name="albumName" [(ngModel)]="newAlbum.name" placeholder="Nombre del álbum" autocomplete="off" required>
            <input type="file" name="albumImage" (change)="obtenerImagenAlbum($event)" accept="image/png,.jpg,.jpeg,.gif">
            <button type="submit" [disabled]="!newAlbum.name || !newAlbum.image">Guardar</button>
        </form>

        <div class="row">


            <div class="gallery-container">
                <div class="movie-card" *ngFor="let albums of albums">
                    <div class="cardImage"  *ngIf="sentence == 'save'">
                            <img (click)="saveInfoAlbum(albums.id)" class="image" title="{{ albums.name }}" [src]="albums.image" [alt]="albums.name" />
                    </div>

                    <div class="cardImage"  *ngIf="sentence == 'open'">
                            <img (click)="navegarCollection(albums.id)" class="image" title="{{ albums.name }}" [src]="albums.image" [alt]="albums.name" />
                    </div>
                    <div class="stars">
                    <p class="title">{{albums.name}}</p>
                </div>
                </div>
                
            </div>


        </div>

        <app-loader *ngIf="loading"></app-loader>

    </div>
</div>
