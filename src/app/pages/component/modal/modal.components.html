<div class="modalPrin">

    <!-- Cabecera -->
    <div class="modal-header">
        <div class="head-text">
            <h4 class="modal-title">{{data.name}}</h4>
            <div class="chips">
                <span class="chip chip-main">{{ typeLabel }}</span>
                <span class="chip" *ngIf="type !== 'Games' && data.releaseDate">Estreno: {{ data.releaseDate }}</span>
                <span class="chip" *ngIf="factLabel && data.randomData">{{ factLabel }}: {{ data.randomData }}</span>
                <span class="chip" *ngIf="type === 'Books' && data.author">{{ data.author }}</span>
                <span class="chip chip-gold" *ngIf="pendiente">En pendientes</span>
            </div>
        </div>
        <button class="btnClose" aria-label="Cerrar" (click)="closeModal()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body">
        <div class="detail-layout">

            <!-- Portada -->
            <div class="detail-cover">
                <img id="myImage" class="imagen" [src]="data.image" alt="#">
            </div>

            <!-- Columna 1: informacion y acciones -->
            <div class="detail-col">
                <div class="block block-grow">
                    <span class="block-title">SINOPSIS</span>
                    <p class="synopsis">{{ data.info || 'Sin descripción.' }}</p>
                </div>

                <div class="action-row">
                    <button *ngIf="!pendiente" type="button" class="btn-ghost" (click)="saveReco()">
                        <i class="uil uil-bookmark"></i> A pendientes
                    </button>
                    <button type="button" class="btn-ghost" (click)="openModalAlbums()">
                        <i class="uil uil-layer-group"></i> A un álbum
                    </button>
                    <button type="button" class="btn-ghost" (click)="openReviewSidebar()">
                        <i class="uil uil-edit"></i> Reseña
                    </button>
                </div>
            </div>

            <!-- Columna 2: tu registro -->
            <div class="detail-col">
                <div class="block">
                    <span class="block-title">TU REGISTRO</span>

                    <div class="rating-row">
                        <div class="star-rating">
                            <span *ngFor="let star of stars; let i = index" (click)="rate(i + 1)"
                                [ngClass]="{'selected': (i + 1) <= dataModal.score}">
                                &#9733;
                            </span>
                        </div>
                        <span class="score-text">{{ dataModal.score || 0 }} / 5</span>
                    </div>

                    <div class="fields">
                        <div class="field">
                            <label for="date">FECHA</label>
                            <input class="date" type="date" id="date" name="date" [(ngModel)]="data.date" required>
                        </div>

                        <div class="field" *ngIf="type !== 'Music'">
                            <label for="type">CATEGORÍA</label>
                            <select id="type" name="type" [(ngModel)]="dataModal.type">
                                <option *ngFor="let opcion of categories" [value]="opcion.id">{{ opcion.name }}</option>
                            </select>
                        </div>

                        <div class="field" *ngIf="type === 'Books'">
                            <label for="kind">FORMATO</label>
                            <select id="kind" name="kind" [(ngModel)]="dataModal.kind">
                                <option *ngFor="let opcion of opKind" [value]="opcion">{{ opcion }}</option>
                            </select>
                        </div>

                        <div class="field" *ngIf="type === 'Games'">
                            <label for="dateR">AÑO DE LANZAMIENTO</label>
                            <input class="date" type="number" id="dateR" name="dateR" [(ngModel)]="dataModal.releaseDate" required>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Acciones -->
        <div class="modal-actions">
            <button class="btn btnModal" (click)="this.save()"><i class="iconModal uil uil-save"> Save</i></button>
        </div>

        <app-loader *ngIf="loading"></app-loader>

    </div>
</div>
